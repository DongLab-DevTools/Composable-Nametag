# gradle.properties의 VERSION 변경 시 자동으로 GitHub Packages에 배포하는 워크플로우
# GROUP은 repository variable(GROUP_OVERRIDE)로 오버라이드 가능
# 러너는 repository variable(RUNS_ON)로 오버라이드 가능 (기본 ubuntu-latest)
# Settings → Secrets and variables → Actions → Variables 에서 설정
name: Publish to GitHub Packages on Version Change

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'gradle.properties'
  # 일부 모듈 배포가 실패했을 때 그 모듈만 다시 배포 (Actions → Run workflow → release 브랜치 선택)
  workflow_dispatch:
    inputs:
      target:
        description: '배포할 모듈'
        type: choice
        options: [all, runtime, compiler, gradle-plugin]
        default: all

permissions:
  contents: write
  packages: write

env:
  GROUP_ARG: ${{ vars.GROUP_OVERRIDE && format('-PGROUP={0}', vars.GROUP_OVERRIDE) || '' }}

jobs:
  check-version-change:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      version-changed: ${{ steps.version-check.outputs.changed }}
      new-version: ${{ steps.version-check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check if VERSION changed
        id: version-check
        run: |
          CURRENT_VERSION=$(grep "^VERSION=" gradle.properties | cut -d '=' -f 2)
          echo "Current version: $CURRENT_VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "Manual run: publishing $CURRENT_VERSION (${{ inputs.target }})"
            exit 0
          fi

          git checkout HEAD~1 -- gradle.properties 2>/dev/null || echo "No previous version found"
          PREVIOUS_VERSION=$(grep "^VERSION=" gradle.properties | cut -d '=' -f 2 2>/dev/null || echo "")
          echo "Previous version: $PREVIOUS_VERSION"

          git checkout HEAD -- gradle.properties

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ] && [ -n "$CURRENT_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

  publish-runtime:
    needs: check-version-change
    if: needs.check-version-change.outputs.version-changed == 'true' && contains(fromJSON('["all", "runtime"]'), inputs.target || 'all')
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
          distribution: 'temurin'
      # GitHub 호스티드 러너에는 SDK 가 이미 있음 — Android SDK 가 없는 자체 러너(RUNS_ON)에서만 설치
      - uses: android-actions/setup-android@v4
        if: vars.RUNS_ON != ''
      - run: chmod +x gradlew
      - name: Publish runtime
        run: ./gradlew :runtime:publishMavenPublicationToGitHubPackagesRepository ${{ env.GROUP_ARG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-compiler:
    needs: check-version-change
    if: needs.check-version-change.outputs.version-changed == 'true' && contains(fromJSON('["all", "compiler"]'), inputs.target || 'all')
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    strategy:
      matrix:
        kotlin: ["2.1.21", "2.2.0", "2.2.10", "2.2.20", "2.2.21", "2.3.0", "2.3.10", "2.3.20", "2.3.21", "2.4.0", "2.4.10", "2.4.20"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
          distribution: 'temurin'
      - run: chmod +x gradlew
      - name: Set Kotlin compiler version for 2.3.x
        if: startsWith(matrix.kotlin, '2.3')
        run: sed -i "s/^kotlin = \".*\"/kotlin = \"2.3.0\"/" gradle/libs.versions.toml
      - name: Set Kotlin compiler version for 2.4.x
        if: startsWith(matrix.kotlin, '2.4')
        run: sed -i "s/^kotlin = \".*\"/kotlin = \"2.4.0\"/" gradle/libs.versions.toml
      - name: Publish compiler for Kotlin ${{ matrix.kotlin }}
        run: |
          ./gradlew :compiler:publishMavenPublicationToGitHubPackagesRepository \
            -PtargetKotlinVersion="${{ matrix.kotlin }}" \
            ${{ env.GROUP_ARG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-gradle-plugin:
    needs: check-version-change
    if: needs.check-version-change.outputs.version-changed == 'true' && contains(fromJSON('["all", "gradle-plugin"]'), inputs.target || 'all')
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
          distribution: 'temurin'
      - run: chmod +x gradlew
      - name: Publish gradle-plugin
        working-directory: gradle-plugin
        run: ../gradlew publishPluginMavenPublicationToGitHubPackagesRepository ${{ env.GROUP_ARG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
