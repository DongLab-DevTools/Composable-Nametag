<svg width="100%" viewBox="0 0 680 830" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .h { font-size: 14px; font-weight: 500; fill: #141413; }
    .hs { font-size: 12px; fill: #3D3D3A; }
    .bt { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
    .bs { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; dominant-baseline: central; }
    .code.strong { font-size: 11px; font-weight: 600; }
    .rt { font-size: 13px; font-weight: 600; }
    .r { font-size: 12px; font-weight: 500; }
    .re { font-size: 11px; }
    .num { font-size: 10px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .ar { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .dv { stroke: #1F1E1D; stroke-opacity: 0.3; stroke-width: 0.5; stroke-dasharray: 4 4; }
  </style>
</defs>
<rect x="0" y="0" width="680" height="830" rx="12" fill="#FFFFFF"/>
<text x="40" y="38" class="h">Compile time</text>
<text x="40" y="56" class="hs">The Kotlin compiler transforms your code</text>
<rect x="40" y="76" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130.0" y="94.0" class="bt" fill="#444441">Your code</text>
<text x="130.0" y="114.0" class="bs" fill="#5F5E5A">@Composable functions</text>
<line x1="220" y1="104" x2="268" y2="104" class="ar" marker-end="url(#arrow)"/>
<rect x="270" y="76" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="360.0" y="94.0" class="bt" fill="#3C3489">compiler-plugin</text>
<text x="360.0" y="114.0" class="bs" fill="#534AB7">IR Transform</text>
<line x1="450" y1="104" x2="498" y2="104" class="ar" marker-end="url(#arrow)"/>
<rect x="500" y="76" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="575.0" y="94.0" class="bt" fill="#085041">Transformed code</text>
<text x="575.0" y="114.0" class="bs" fill="#0F6E56">Marker call injected</text>
<rect x="40" y="160" width="270" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="184" class="code" fill="#5F5E5A" xml:space="preserve">@Composable</text>
<text x="56" y="204" class="code" fill="#5F5E5A" xml:space="preserve">fun HomeScreen() {</text>
<text x="56" y="224" class="code" fill="#5F5E5A" xml:space="preserve">  Column { ... }</text>
<line x1="310" y1="200" x2="348" y2="200" class="ar" marker-end="url(#arrow)"/>
<rect x="350" y="152" width="300" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="366" y="176" class="code" fill="#0F6E56" xml:space="preserve">@Composable</text>
<text x="366" y="196" class="code" fill="#0F6E56" xml:space="preserve">fun HomeScreen() {</text>
<text x="366" y="216" class="code strong" fill="#085041" xml:space="preserve">  __debugComposableName("HomeScreen")</text>
<text x="366" y="236" class="code" fill="#0F6E56" xml:space="preserve">  Column { ... }</text>
<line x1="40" y1="280" x2="640" y2="280" class="dv"/>
<text x="40" y="310" class="h">Runtime</text>
<text x="40" y="328" class="hs">Labels are drawn outside your layout, on top of the window (debug only)</text>
<rect x="40" y="348" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="107.5" y="366.0" class="bt" fill="#085041">Name tag</text>
<text x="107.5" y="386.0" class="bs" fill="#0F6E56">No layout node</text>
<line x1="175" y1="376" x2="193" y2="376" class="ar" marker-end="url(#arrow)"/>
<rect x="195" y="348" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="262.5" y="366.0" class="bt" fill="#3C3489">Bounds</text>
<text x="262.5" y="386.0" class="bs" fill="#534AB7">Read slot table</text>
<line x1="330" y1="376" x2="348" y2="376" class="ar" marker-end="url(#arrow)"/>
<rect x="350" y="348" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="417.5" y="366.0" class="bt" fill="#3C3489">Display rules</text>
<text x="417.5" y="386.0" class="bs" fill="#534AB7">Visible names only</text>
<line x1="485" y1="376" x2="503" y2="376" class="ar" marker-end="url(#arrow)"/>
<rect x="505" y="348" width="135" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="572.5" y="366.0" class="bt" fill="#712B13">Overlay</text>
<text x="572.5" y="386.0" class="bs" fill="#993C1D">Placed without overlap</text>
<rect x="40" y="424" width="600" height="176" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="56" y="448" class="rt" fill="#3C3489">Display rules</text>
<circle cx="64" cy="470" r="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="64" y="470" class="num" fill="#3C3489">1</text>
<text x="80" y="474" class="r" fill="#3D3D3A">Nothing drawn → skipped</text>
<text x="634" y="474" class="re" fill="#73726C" text-anchor="end">Effect · Theme · Dialog not shown</text>
<circle cx="64" cy="496" r="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="64" y="496" class="num" fill="#3C3489">2</text>
<text x="80" y="500" class="r" fill="#3D3D3A">Off screen or hidden view → skipped</text>
<text x="634" y="500" class="re" fill="#73726C" text-anchor="end">Items scrolled away · kept-alive tabs</text>
<circle cx="64" cy="522" r="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="64" y="522" class="num" fill="#3C3489">3</text>
<text x="80" y="526" class="r" fill="#3D3D3A">Wrapper chain with the same bounds → outermost name only</text>
<text x="634" y="526" class="re" fill="#73726C" text-anchor="end">MovieItem › Poster › Thumbnail shows MovieItem</text>
<circle cx="64" cy="548" r="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="64" y="548" class="num" fill="#3C3489">4</text>
<text x="80" y="552" class="r" fill="#3D3D3A">Inside a repeated list item → one level deep</text>
<text x="634" y="552" class="re" fill="#73726C" text-anchor="end">ShortcutItem › ShortcutIcon, not IconImage</text>
<line x1="56" y1="566" x2="624" y2="566" stroke="#534AB7" stroke-opacity="0.25" stroke-width="0.5"/>
<text x="56" y="586" class="re" fill="#3D3D3A">Placement: biggest first, free corner, else dropped</text>
<text x="624" y="586" class="re" fill="#73726C" text-anchor="end">Updates run in ~2ms steps between frames</text>
<line x1="40" y1="632" x2="640" y2="632" class="dv"/>
<text x="40" y="662" class="h">Distribution</text>
<text x="40" y="680" class="hs">Only the compiler plugin is published per Kotlin version</text>
<rect x="40" y="700" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125.0" y="718.0" class="bt" fill="#444441">gradle-plugin</text>
<text x="125.0" y="738.0" class="bs" fill="#5F5E5A">Auto version matching</text>
<line x1="210" y1="728" x2="248" y2="728" class="ar" marker-end="url(#arrow)"/>
<rect x="250" y="700" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="335.0" y="718.0" class="bt" fill="#3C3489">compiler-plugin</text>
<text x="335.0" y="738.0" class="bs" fill="#534AB7">Per Kotlin version</text>
<line x1="420" y1="728" x2="458" y2="728" class="ar" marker-end="url(#arrow)"/>
<rect x="460" y="700" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="545.0" y="718.0" class="bt" fill="#085041">runtime</text>
<text x="545.0" y="738.0" class="bs" fill="#0F6E56">Version independent</text>
<text x="40" y="790" class="hs">debug build → plugin applied, labels shown</text>
<text x="40" y="808" class="hs">release build → plugin not applied, zero overhead</text>
</svg>
